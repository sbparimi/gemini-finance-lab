name: Finance Product QA Agent
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  specialist-review:
    name: Specialist finance product review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposal
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run lint
      - name: Build application
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Start app and run specialist review
        run: |
          npm run start > /tmp/gemini-finance-lab.log 2>&1 &
          echo $! > /tmp/gemini-finance-lab.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then break; fi
            sleep 2
          done
          npm run review:agent
      - name: Publish review report to workflow summary
        if: always()
        run: |
          if [ -f artifacts/finance-product-qa-report.md ]; then cat artifacts/finance-product-qa-report.md >> "$GITHUB_STEP_SUMMARY"; else echo "QA report was not generated. Inspect preceding build or test logs." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-product-qa-report
          path: artifacts/
          if-no-files-found: ignore
      - name: Comment findings on pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'artifacts/finance-product-qa-report.md';
            const body = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8')
              : '# Finance Product QA Agent\n\nReview report unavailable because an earlier build or setup step failed. Inspect the workflow logs.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
